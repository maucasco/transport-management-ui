services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: transport_user
      POSTGRES_PASSWORD: transport_pass
      POSTGRES_DB: transport_auth
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_user -d transport_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./transport-identidad-auth-api-manager
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://transport_user:transport_pass@db:5432/transport_auth
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRE_HOURS: 8
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
