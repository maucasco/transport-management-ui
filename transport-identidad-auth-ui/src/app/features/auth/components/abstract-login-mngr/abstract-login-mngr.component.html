<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h1 class="login-form__title">Iniciar sesión</h1>

  <div class="login-form__field">
    <label class="login-form__label" for="email">Correo electrónico</label>
    <input
      id="email"
      class="login-form__input"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="usuario@empresa.com"
    />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <span class="login-form__field-error">Ingresa un correo válido</span>
    }
  </div>

  <div class="login-form__field">
    <label class="login-form__label" for="password">Contraseña</label>
    <input
      id="password"
      class="login-form__input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <span class="login-form__field-error">La contraseña es requerida</span>
    }
  </div>

  @if (state === 'error') {
    <p class="login-form__error" role="alert">{{ errorMessage }}</p>
  }

  <button
    class="login-form__submit"
    type="submit"
    [disabled]="state === 'loading'"
  >
    @if (state === 'loading') {
      <span class="login-form__spinner" aria-hidden="true"></span>
      Ingresando…
    } @else {
      Ingresar
    }
  </button>
</form>
