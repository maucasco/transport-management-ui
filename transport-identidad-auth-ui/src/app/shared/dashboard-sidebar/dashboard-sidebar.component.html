<nav class="dash-sidebar" aria-label="Menú principal">
  <ul class="dash-sidebar__list" role="list">
    @for (item of menuItems; track item.label) {
      <li class="dash-sidebar__item">
        <span
          class="dash-sidebar__link"
          [class.dash-sidebar__link--disabled]="item.disabled"
          [attr.aria-disabled]="item.disabled"
          [attr.tabindex]="item.disabled ? -1 : 0"
        >
          <span class="dash-sidebar__label">{{ item.label }}</span>
          @if (item.disabled) {
            <span class="dash-sidebar__badge">Próximamente</span>
          }
        </span>
      </li>
    }
  </ul>

  <div class="dash-sidebar__divider" role="separator"></div>

  <button class="dash-sidebar__logout" (click)="logout()" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Cerrar sesión
  </button>
</nav>
