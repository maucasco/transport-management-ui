<header class="dash-header" role="banner">
  <div class="dash-header__container">
    <a routerLink="/dashboard" class="dash-header__brand" aria-label="Ir al dashboard">
      <svg class="dash-header__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 3h15v13H1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M16 8h4l3 3v5h-7V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="5.5" cy="18.5" r="2.5" stroke="currentColor" stroke-width="2"/>
        <circle cx="18.5" cy="18.5" r="2.5" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="dash-header__brand-name">TransportControl</span>
    </a>

    <div class="dash-header__user">
      <div class="dash-header__user-info">
        <span class="dash-header__user-name">{{ user().first_name }} {{ user().last_name }}</span>
        <span class="dash-header__user-role">{{ roleBadge }}</span>
      </div>
      <button class="dash-header__logout-btn" (click)="logout()" type="button" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="18" height="18">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
